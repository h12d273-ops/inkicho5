<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>말바꿈 - AI 청소년 언어습관 개선 코치</title>
  <style>
    :root {
      --primary: #4F46E5;
      --primary-hover: #4338CA;
      --bg: #F8FAFC;
      --card: #FFFFFF;
      --text: #1E293B;
      --subtext: #64748B;
      --danger-bg: #FEF2F2;
      --danger-border: #FECACA;
      --danger-text: #DC2626;
      --safe-bg: #F0FDF4;
      --safe-border: #BBF7D0;
      --safe-text: #16A34A;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Pretendard', -apple-system, BlinkMacSystemFont, system-ui, sans-serif; }
    body { background-color: var(--bg); color: var(--text); display: flex; justify-content: center; padding: 40px 20px; line-height: 1.6; }
    .container { width: 100%; max-width: 640px; }

    header { text-align: center; margin-bottom: 28px; }
    header h1 { font-size: 2rem; color: var(--primary); font-weight: 800; letter-spacing: -0.5px; }
    header p { color: var(--subtext); font-size: 0.95rem; margin-top: 6px; }

    .card { background: var(--card); border-radius: 16px; padding: 24px; box-shadow: 0 4px 20px rgba(0, 0, 0, 0.05); margin-bottom: 20px; border: 1px solid #E2E8F0; }
    
    .api-box { display: flex; gap: 8px; margin-bottom: 16px; }
    .api-box input { flex: 1; padding: 10px 14px; border: 1px solid #CBD5E1; border-radius: 8px; font-size: 0.85rem; }

    label { display: block; font-weight: 700; margin-bottom: 8px; font-size: 0.95rem; }
    textarea { width: 100%; height: 100px; padding: 14px; border: 1px solid #CBD5E1; border-radius: 12px; font-size: 1rem; resize: none; transition: border 0.2s; }
    textarea:focus { outline: none; border-color: var(--primary); }

    .examples { display: flex; gap: 8px; flex-wrap: wrap; margin: 12px 0 18px; }
    .example-chip { background: #EEF2FF; color: var(--primary); border: none; padding: 6px 12px; border-radius: 20px; font-size: 0.82rem; font-weight: 600; cursor: pointer; transition: 0.2s; }
    .example-chip:hover { background: #E0E7FF; }

    .btn-submit { width: 100%; padding: 14px; background: var(--primary); color: white; border: none; border-radius: 12px; font-size: 1rem; font-weight: 700; cursor: pointer; transition: 0.2s; }
    .btn-submit:hover { background: var(--primary-hover); }
    .btn-submit:disabled { background: #94A3B8; cursor: not-allowed; }

    /* 결과 영역 */
    #resultCard { display: none; animation: fadeIn 0.3s ease; }
    @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }

    .badge { display: inline-block; padding: 6px 12px; border-radius: 8px; font-weight: 700; font-size: 0.85rem; margin-bottom: 16px; }
    .badge.harmful { background: var(--danger-bg); color: var(--danger-text); border: 1px solid var(--danger-border); }
    .badge.safe { background: var(--safe-bg); color: var(--safe-text); border: 1px solid var(--safe-border); }

    .section { margin-bottom: 18px; }
    .section h3 { font-size: 0.9rem; color: var(--subtext); margin-bottom: 4px; }
    .section p { font-size: 0.98rem; color: var(--text); background: #F8FAFC; padding: 12px; border-radius: 10px; }

    .rec-list { list-style: none; display: flex; flex-direction: column; gap: 10px; margin-top: 8px; }
    .rec-item { display: flex; justify-content: space-between; align-items: center; background: #EEF2FF; padding: 12px 16px; border-radius: 10px; color: #1E1B4B; font-weight: 600; font-size: 0.95rem; cursor: pointer; transition: 0.2s; border: 1px solid #C7D2FE; }
    .rec-item:hover { background: #E0E7FF; transform: translateX(3px); }
    .copy-tag { font-size: 0.75rem; background: white; color: var(--primary); padding: 4px 8px; border-radius: 6px; font-weight: 700; }

    .notice { text-align: center; font-size: 0.8rem; color: var(--subtext); margin-top: 16px; }
  </style>
</head>
<body>

<div class="container">
  <header>
    <h1>💬 말바꿈</h1>
    <p>AI가 문맥을 분석하고 상대방을 존중하는 표현으로 바꿔드려요</p>
  </header>

  <div class="card">
    <div class="api-box">
      <input type="password" id="apiKey" placeholder="여기에 Gemini API 키를 입력하세요 (AIza...)">
    </div>

    <label for="userInput">평소 자주 쓰거나 고민되는 문장을 입력해 보세요</label>
    <textarea id="userInput" placeholder="예: 너 진짜 개못하네."></textarea>

    <div class="examples">
      <button class="example-chip" onclick="setExample('너 진짜 개못하네.')">예시1: 능력 비하</button>
      <button class="example-chip" onclick="setExample('와 오늘 급식 개맛있다!')">예시2: 긍정적 감탄(문맥 테스트)</button>
      <button class="example-chip" onclick="setExample('야 넌 눈치가 없냐? 그걸 왜 못 해')">예시3: 은근한 조롱</button>
    </div>

    <button class="btn-submit" id="analyzeBtn" onclick="analyzeText()">AI 문맥 분석 및 표현 추천받기</button>
  </div>

  <!-- 분석 결과 카드 -->
  <div class="card" id="resultCard">
    <div id="categoryBadge" class="badge"></div>

    <div class="section">
      <h3>🔍 표현의 사전적·문맥적 의미</h3>
      <p id="meaningText"></p>
    </div>

    <div class="section">
      <h3>💭 상대방에게 미칠 수 있는 영향</h3>
      <p id="impactText"></p>
    </div>

    <div class="section">
      <h3>✨ 이렇게 바꿔 말해볼까요? (클릭하면 복사됩니다)</h3>
      <ul class="rec-list" id="recList"></ul>
    </div>

    <p class="notice">※ AI 분석 결과는 문맥에 따라 달라질 수 있으며, 언어폭력 여부를 최종 확정하지 않습니다.</p>
  </div>
</div>

<script>
  const SYSTEM_PROMPT = `당신은 청소년의 올바른 언어습관 형성을 돕는 AI 언어 코치 '말바꿈'입니다.
사용자가 입력한 한국어 문장을 분석하여, 단순 욕설 감지를 넘어 문맥 속의 공격성·비하 의도를 파악하고 상대방을 존중하는 대체 표현을 제안하는 역할을 합니다.

[분석 기준]
1. 직접적 욕설 및 비속어
2. 능력·외모·성격 비하 및 은근한 조롱
3. 차별·혐오 표현
4. 공격적·위협적 언행
5. 정상 표현 (친근한 농담, 감탄사, 일상 대화 등 공격성이 없는 경우)

[응답 원칙]
- 훈계하거나 비난하지 말고, 객관적이고 친절한 교육적 어조를 유지하세요.
- 같은 단어라도 문맥상 친근한 표현이나 감탄사(예: "개좋다", "미쳤다 대박")라면 '정상 표현'으로 분류하세요.
- 대체 표현은 청소년이 실제 교실에서 어색하지 않게 바로 쓸 수 있는 자연스러운 말투로 3가지를 추천하세요.
- 반드시 아래 JSON 형식으로만 응답하세요.

[출력 JSON 형식]
{
  "is_harmful": true 또는 false,
  "category": "표현 유형 (예: 능력 비하 가능성, 직접적 욕설, 은근한 조롱, 정상 표현 등)",
  "meaning": "해당 표현의 사전적 의미와 현재 문장 속 문맥적 의미 설명 (1~2문장)",
  "impact": "이 표현을 들었을 때 상대방이 느낄 수 있는 감정과 영향",
  "recommendations": [
    "대체 표현 1",
    "대체 표현 2",
    "대체 표현 3"
  ]
}`;

  function setExample(text) {
    document.getElementById('userInput').value = text;
  }

  // 빠르고 가벼운 최신 3.5-flash-lite를 1순위로, 3.8-flash를 2순위로 자동 전환 호출
  async function callGeminiWithFallback(apiKey, userInput) {
    const models = ['gemini-3.5-flash-lite', 'gemini-3.8-flash'];
    let lastError = null;

    for (const model of models) {
      try {
        const response = await fetch(`https://generativelanguage.googleapis.com/v1beta/models/${model}:generateContent?key=${apiKey}`, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({
            systemInstruction: {
              parts: [{ text: SYSTEM_PROMPT }]
            },
            contents: [
              { role: 'user', parts: [{ text: userInput }] }
            ],
            generationConfig: {
              responseMimeType: "application/json"
            }
          })
        });

        const data = await response.json();
        if (!data.error) {
          return data;
        }
        lastError = new Error(data.error.message);
      } catch (err) {
        lastError = err;
      }
    }
    throw lastError;
  }

  async function analyzeText() {
    const apiKey = document.getElementById('apiKey').value.trim();
    const userInput = document.getElementById('userInput').value.trim();
    const btn = document.getElementById('analyzeBtn');

    if (!apiKey) {
      alert('Google AI Studio에서 발급받은 Gemini API 키를 먼저 입력해 주세요!');
      return;
    }
    if (!userInput) {
      alert('분석할 문장을 입력해 주세요!');
      return;
    }

    btn.disabled = true;
    btn.innerText = 'AI가 문맥을 분석하고 있습니다...';

    try {
      const data = await callGeminiWithFallback(apiKey, userInput);
      const rawText = data.candidates[0].content.parts[0].text;
      const result = JSON.parse(rawText);
      renderResult(result);

    } catch (error) {
      alert('오류가 발생했습니다: ' + error.message);
    } finally {
      btn.disabled = false;
      btn.innerText = 'AI 문맥 분석 및 표현 추천받기';
    }
  }

  function renderResult(result) {
    const resultCard = document.getElementById('resultCard');
    const badge = document.getElementById('categoryBadge');

    badge.innerText = (result.is_harmful ? '⚠️ ' : '✅ ') + result.category;
    badge.className = 'badge ' + (result.is_harmful ? 'harmful' : 'safe');

    document.getElementById('meaningText').innerText = result.meaning;
    document.getElementById('impactText').innerText = result.impact;

    const recList = document.getElementById('recList');
    recList.innerHTML = '';
    result.recommendations.forEach(text => {
      const li = document.createElement('li');
      li.className = 'rec-item';
      li.innerHTML = `<span>"${text}"</span><span class="copy-tag">복사</span>`;
      li.onclick = () => {
        navigator.clipboard.writeText(text);
        li.querySelector('.copy-tag').innerText = '복사됨!';
        setTimeout(() => li.querySelector('.copy-tag').innerText = '복사', 1500);
      };
      recList.appendChild(li);
    });

    resultCard.style.display = 'block';
  }
</script>

</body>
</html>
